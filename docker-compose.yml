services:
  postgres:
    image: postgres:16-alpine
    container_name: vx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vx_control
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vx-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vx_control
      APP_PORT: 3001
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      # Autenticación — ver .env.example para qué hace cada una.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INITIAL_ACCESS_PASSWORD: ${INITIAL_ACCESS_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-43200}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports:
      - "3001:3001"
      - "3000:3001"
    networks:
      - vx-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  vx-network:
    driver: bridge

volumes:
  postgres_data:
