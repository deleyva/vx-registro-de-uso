[project]
name = "vx-registro-de-uso"
version = "2.1.0"
description = "VX Control Center API — Python rewrite (FastAPI + SQLAlchemy + HTMX)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "deleyva" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "cuid2",
    "pytailwindcss>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I"]
"tests/*" = ["B"]
# FastAPI's Depends/Query/Body are intentionally used as argument defaults.
"src/app/routers/*" = ["B008"]
